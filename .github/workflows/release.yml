name: Release

# Publish to npm from GitHub Actions with provenance, then create a GitHub
# Release for the same tag. Triggered by pushing a version tag (e.g. v0.1.3)
# after bumping package.json:
#   npm version patch && git push --tags
#
# Two credentials are used:
#   - NPM_TOKEN (GitHub secret): a granular access token with "Publish"
#     permission + "Bypass 2FA" checked — npm publishes with it and records
#     the GitHub provenance link.
#   - GITHUB_TOKEN (provided automatically): used to create the GitHub Release
#     for the tag (needs the `contents: write` permission below).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Run tests
        run: npm test
      - name: Tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
